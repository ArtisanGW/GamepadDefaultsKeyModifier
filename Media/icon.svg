<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gamepad Defaults Key Modifier: the controller's four face buttons, the top one (Y) lit in yellow,
       and a pink chevron trail to what it opens with no target: the quest log (a scroll) or the bags.
       Palette as Alt Courier's icon: navy, teal, pastel pink, yellow and tan. -->
  <rect x="0" y="0" width="512" height="512" fill="#15202E"/>

  <!-- the face buttons: a diamond, Y on top lit -->
  <g stroke-width="16">
    <circle cx="160" cy="150" r="44" fill="#F6D98B" stroke="#F6D98B"/>
    <circle cx="160" cy="362" r="40" fill="#15202E" stroke="#5BE0C8"/>
    <circle cx="74" cy="256" r="40" fill="#15202E" stroke="#5BE0C8"/>
    <circle cx="246" cy="256" r="40" fill="#15202E" stroke="#5BE0C8"/>
  </g>
  <!-- the press: a small dot in Y -->
  <circle cx="160" cy="150" r="12" fill="#15202E"/>

  <!-- the chevron trail from Y -->
  <g fill="none" stroke="#F4A7B9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 232 126 L 256 150 L 232 174"/>
    <path d="M 278 126 L 302 150 L 278 174"/>
  </g>

  <!-- the quest log: a tan scroll with teal lines -->
  <rect x="330" y="64" width="128" height="160" rx="22" fill="#D9B48F"/>
  <rect x="318" y="56" width="152" height="30" rx="15" fill="#15202E" stroke="#D9B48F" stroke-width="14"/>
  <rect x="318" y="202" width="152" height="30" rx="15" fill="#15202E" stroke="#D9B48F" stroke-width="14"/>
  <g stroke="#15202E" stroke-width="12" stroke-linecap="round">
    <path d="M 358 118 H 430"/>
    <path d="M 358 146 H 430"/>
    <path d="M 358 174 H 406"/>
  </g>

  <!-- the bag: a pink pouch, cinched with a teal tie -->
  <path d="M 374 330 C 296 356 300 460 396 460 C 492 460 496 356 418 330 Z"
        fill="#15202E" stroke="#F4A7B9" stroke-width="16" stroke-linejoin="round"/>
  <path d="M 350 290 Q 396 306 442 290 L 420 326 H 372 Z"
        fill="#15202E" stroke="#F4A7B9" stroke-width="16" stroke-linejoin="round"/>
  <path d="M 362 330 H 430" fill="none" stroke="#5BE0C8" stroke-width="16" stroke-linecap="round"/>
</svg>
